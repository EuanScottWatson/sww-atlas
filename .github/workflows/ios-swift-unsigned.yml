name: Build Swift iPhone app
on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional XCTest identifier for a focused simulator run
        required: false
        type: string
permissions:
  contents: read
jobs:
  swift-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test travel calculations
        run: swift test --package-path ios-native
      - name: Test isolated website API
        run: python3 -m unittest -q test_isolated.py
        working-directory: website
      - name: Install project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios-native/project.yml
      - name: Prepare isolated simulator server
        run: |
          mkdir -p website/import "$RUNNER_TEMP/atlas-ui-data"
          cp website/import-example/*.json website/import/
          cp ios-native/UITestFixtures/*.json website/import/
          HOLIDAY_DATA_DIR="$RUNNER_TEMP/atlas-ui-data" python3 website/server.py --host 127.0.0.1 --port 18780 >"$RUNNER_TEMP/atlas-ui-server.log" 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:18780/health && break; sleep 1; done
      - name: Run iPhone simulator tests
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          echo "$DEVICE_ID" > "$RUNNER_TEMP/atlas-device-id"
          TEST_ARGS=()
          if [[ -n "$TEST_FILTER" ]]; then TEST_ARGS+=("-only-testing:$TEST_FILTER"); fi
          xcodebuild test -project ios-native/AtlasNative.xcodeproj -scheme AtlasNative "${TEST_ARGS[@]}" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/atlas-simulator" -resultBundlePath "$RUNNER_TEMP/AtlasUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          if [[ -n "$TEST_FILTER" ]]; then exit 0; fi
          curl -fsS http://127.0.0.1:18780/api/data > "$RUNNER_TEMP/atlas-ui-result.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); event=next(x for x in d["events"] if x["name"]=="Atlas Test Event"); trip=next(x for x in d["trips"] if x["name"]=="Atlas Test Trip"); stops=[x for x in d["trips"] if x.get("journey_name")=="Atlas Test Journey"]; assert event["start"]==event["end"]=="2026-05-02" and event["notes"]=="Sample event"; assert any(x["name"]=="Atlas New Trip" for x in d["trips"]); assert len(stops)==2 and stops[0]["group"]==stops[1]["group"]; assert d["summaries"]["2026"]["leave_left"]==7 and d["summaries"]["2026"]["notes"]=="Sample reference"; assert trip["notes"]=="Sample trip" and any(p["name"]=="Atlas Test Marker" for p in trip.get("pins",[])); print("Simulator saves verified against isolated server")' "$RUNNER_TEMP/atlas-ui-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-simulator-evidence
          path: |
            ${{ runner.temp }}/AtlasUITests.xcresult
            ${{ runner.temp }}/atlas-ui-server.log
            ${{ runner.temp }}/atlas-ui-data/holidays.sqlite3
          if-no-files-found: warn
          retention-days: 7
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project ios-native/AtlasNative.xcodeproj -scheme AtlasNative \
            -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/atlas-swift" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/atlas-swift/Build/Products/Release-iphoneos/TheSWWAtlas.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry SWW-Atlas-Swift-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: sww-atlas-swift-unsigned-ios
          path: ${{ runner.temp }}/package/SWW-Atlas-Swift-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
