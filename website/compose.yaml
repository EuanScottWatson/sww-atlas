# Review paths and take a backup before replacing the existing deployment.
services:
  holidays:
    build: .
    container_name: holiday-tracker
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "127.0.0.1:7780:8000"
      - "192.168.32.48:7780:8000"
      - "100.94.227.14:7780:8000"
    volumes:
      - ../../holiday-tracker/data:/app/data
      - ../../holiday-tracker/import:/app/import:ro
      - ../../holiday-tracker-source:/app/photos:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
